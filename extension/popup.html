<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0F0F11; --card:#1E1E23; --line:#2C2C33; --gold:#D4AF37; --ink:#F2F2F4; --muted:#9C9CA6; --green:#4CC26B; --red:#E5533D; }
  * { box-sizing: border-box; }
  body { margin:0; width:340px; background:var(--bg); color:var(--ink); font:13px "Segoe UI", Tahoma, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:14px 14px 10px; border-bottom:1px solid var(--line); }
  header img { width:34px; height:34px; }
  h1 { margin:0; font-size:17px; direction:ltr; text-align:right; }
  h1 b { color:var(--gold); }
  .sub { color:var(--muted); font-size:11px; }
  .status { margin:12px 14px 0; padding:10px 12px; border-radius:8px; background:var(--card); border:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
  .on .dot { background:var(--green); } .off .dot { background:var(--red); }
  .row { display:flex; align-items:center; justify-content:space-between; margin:12px 14px 0; }
  .switch { position:relative; width:40px; height:22px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:#3a3a42; border-radius:22px; cursor:pointer; transition:.2s; }
  .slider:before { content:""; position:absolute; width:16px; height:16px; right:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  input:checked + .slider { background:var(--gold); }
  input:checked + .slider:before { transform:translateX(-18px); }
  h2 { font-size:12px; color:var(--muted); font-weight:400; margin:16px 14px 6px; }
  .media { margin:0 14px; max-height:230px; overflow:auto; }
  .item { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--line); background:var(--card); border-radius:8px; margin-bottom:6px; }
  .item .n { flex:1; min-width:0; }
  .item .n div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:ltr; text-align:right; }
  .item .n small { color:var(--muted); }
  button { font:600 12px "Segoe UI", Tahoma, sans-serif; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 12px; cursor:pointer; }
  button:hover { background:#2A2A31; }
  button.gold { background:var(--gold); color:#111; border-color:var(--gold); }
  button.gold:hover { background:#E2C25A; }
  .actions { margin:14px; display:flex; gap:8px; }
  .actions button { flex:1; }
  .empty { color:var(--muted); margin:0 14px; font-size:12px; }
  footer { border-top:1px solid var(--line); padding:9px 14px; color:var(--muted); font-size:11px; display:flex; justify-content:space-between; }
  footer b { color:var(--gold); font-weight:600; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div><h1>IBDM <b>Pro</b></h1><div class="sub">مدير التحميل</div></div>
  </header>
  <div id="status" class="status"><span class="dot"></span><span id="statusText">جاري الاتصال بالبرنامج…</span></div>
  <div class="row"><span>التقاط التحميلات من المتصفح</span>
    <label class="switch"><input type="checkbox" id="capture"><span class="slider"></span></label></div>
  <h2>الفيديوهات في هذه الصفحة</h2>
  <div id="media" class="media"></div>
  <div class="actions">
    <button class="gold" id="pageVideo">تحميل فيديو هذه الصفحة</button>
  </div>
  <footer><span>من تصميم و تطوير و تعريب <b>ابراهيم الخزرجي</b></span><span id="ver"></span></footer>
  <script src="popup.js"></script>
</body>
</html>
