name: Brave extension test

on:
  push:
    branches: [brave-test]

permissions:
  contents: write

jobs:
  brave:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          dotnet publish src/IbdmPro.App/IbdmPro.App.csproj -c Release -r win-x64 --self-contained -p:Version=1.0.500 -p:DebugType=none -o build/publish
          Copy-Item extension build/publish/extension -Recurse -Force
      - name: Install Brave
        run: |
          choco install brave -y --no-progress
          Get-ChildItem "C:\Program Files\BraveSoftware\Brave-Browser\Application" -ErrorAction SilentlyContinue | Select-Object -First 5
          Get-ChildItem "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application" -ErrorAction SilentlyContinue | Select-Object -First 5
      - name: Install the extension in Brave
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($file) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($file); $g.Dispose(); $bmp.Dispose()
          }
          $ext = (Resolve-Path build/publish/extension).Path
          $exe = (Resolve-Path build/publish/IBDMPro.exe).Path
          $app = Start-Process $exe -ArgumentList "--background" -PassThru
          Start-Sleep 6
          $p = Start-Process $exe -ArgumentList "--install-extension", "brave", "$PWD/install-brave.txt", $ext -PassThru
          for ($i = 1; $i -le 14; $i++) { Start-Sleep 8; Shot "shots/brave-$i.png"; if ($p.HasExited) { break } }
          $p.WaitForExit(60000) | Out-Null
          Shot "shots/brave-final.png"
          # Open the extension's "Errors" page and photograph it.
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Errors")
          $btn = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond)
          if ($btn) { $btn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); Start-Sleep 3; Shot "shots/brave-errors.png" } else { "no errors button" | Out-File shots/no-errors.txt }
          Start-Process $exe -ArgumentList "--dump-uia", "brave", "$PWD/shots/uia-1.txt" -Wait
          Start-Sleep 5
          Start-Process $exe -ArgumentList "--dump-uia", "brave", "$PWD/shots/uia-2.txt" -Wait
          Copy-Item install-brave.txt shots/ -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA/IBDM Pro/log.txt" shots/ -ErrorAction SilentlyContinue
          Invoke-RestMethod http://127.0.0.1:39401/status | ConvertTo-Json -Compress | Out-File shots/status-1.txt
          Get-Process brave -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          # Like loading it by hand: start Brave with the folder and see whether it runs.
          $bexe = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\brave.exe" -ErrorAction SilentlyContinue).'(default)'
          if (-not $bexe) { $bexe = (Get-ItemProperty "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\brave.exe" -ErrorAction SilentlyContinue).'(default)' }
          $bexe | Out-File shots/brave-exe.txt
          Start-Process $bexe -ArgumentList "--no-first-run", "--load-extension=$ext", "brave://extensions"
          Start-Sleep 25
          Shot "shots/brave-load-extension.png"
          Invoke-RestMethod http://127.0.0.1:39401/status | ConvertTo-Json -Compress | Out-File shots/status-2.txt
          
          Get-Process brave -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
      - name: Push results
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan brave-results
          git rm -rf --cached . | Out-Null
          git add -f shots
          git commit -m "brave results" | Out-Null
          git push -f origin brave-results
