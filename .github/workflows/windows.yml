name: Build IBRA Download Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Engine tests (real downloads)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tools
        timeout-minutes: 6
        run: |
          # A static FFmpeg build (apt mirrors are sometimes very slow on the runners)
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
          echo "$(ls -d /tmp/ffmpeg-master-latest-linux64-gpl)/bin" >> $GITHUB_PATH
          pip install -q yt-dlp
      - name: Every text has its English translation
        run: |
          missing=$(python3 -I tools/i18n_missing.py "$PWD")
          if [ -n "$missing" ]; then echo "Missing English for:"; echo "$missing"; exit 1; fi
      - name: Run tests
        run: tests/run.sh
        env:
          IBDM_LIVE: "1"

  build:
    name: Windows app + installer
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: v
        run: |
          $version = "1.0.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "IBRA Download Manager $version"

      - name: Publish the app
        run: |
          $out = "build/publish"
          dotnet publish src/IbdmPro.App/IbdmPro.App.csproj -c Release -r win-x64 --self-contained -p:Version=${{ steps.v.outputs.version }} -p:DebugType=none -o $out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path "$out/IBRADownloadManager.exe")) { throw "IBRADownloadManager.exe was not built" }

      - name: Browser extension (same version as the app)
        run: |
          $ext = "build/publish/extension"
          Copy-Item extension $ext -Recurse -Force
          $m = Get-Content "$ext/manifest.json" -Raw -Encoding utf8
          $m = $m -replace '"version":\s*"[^"]*"', '"version": "${{ steps.v.outputs.version }}"'
          [IO.File]::WriteAllText((Resolve-Path "$ext/manifest.json"), $m, (New-Object Text.UTF8Encoding $false))
          New-Item -ItemType Directory -Force build/installer | Out-Null
          Compress-Archive -Path "$ext/*" -DestinationPath build/installer/IBRA-Download-Manager-Extension.zip -Force
          # Firefox copy: background scripts instead of a service worker, and a Firefox add-on id.
          $ff = "build/publish/extension-firefox"
          Copy-Item $ext $ff -Recurse -Force
          $j = Get-Content "$ff/manifest.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $j.background = [pscustomobject]@{ scripts = @("i18n.js", "background.js") }
          $j | Add-Member -NotePropertyName browser_specific_settings -NotePropertyValue ([pscustomobject]@{ gecko = [pscustomobject]@{ id = "ibdm-pro@ibraprogram"; strict_min_version = "128.0" } })
          [IO.File]::WriteAllText((Resolve-Path "$ff/manifest.json"), ($j | ConvertTo-Json -Depth 10), (New-Object Text.UTF8Encoding $false))
          Get-Content "$ff/manifest.json"

      - name: Bundle yt-dlp and FFmpeg
        run: |
          $tools = "build/publish/tools"
          New-Item -ItemType Directory -Force $tools, dl | Out-Null
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$tools/yt-dlp.exe"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile dl/ffmpeg.zip
          Expand-Archive dl/ffmpeg.zip dl/ffmpeg
          Get-ChildItem dl/ffmpeg -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination $tools
          if (!(Test-Path "$tools/ffmpeg.exe")) { throw "ffmpeg.exe missing" }
          # Deno: the JavaScript runtime yt-dlp needs for YouTube formats.
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile dl/deno.zip
          Expand-Archive dl/deno.zip dl/deno
          Copy-Item dl/deno/deno.exe $tools
          if (!(Test-Path "$tools/deno.exe")) { throw "deno.exe missing" }
          & "$tools/yt-dlp.exe" --version
          & "$tools/deno.exe" --version

      - name: Real YouTube check (formats listed with Deno)
        continue-on-error: true
        run: |
          $tools = (Resolve-Path build/publish/tools).Path
          $json = & "$tools/yt-dlp.exe" -J --no-playlist --no-warnings --ignore-no-formats-error --js-runtimes "deno:$tools\deno.exe" "https://www.youtube.com/watch?v=jNQXAC9IVRw" 2>&1
          try {
            $d = ($json | Where-Object { $_ -like '{*' }) | ConvertFrom-Json
            $heights = $d.formats | Where-Object { $_.height } | ForEach-Object { $_.height } | Sort-Object -Unique
            Write-Host "title: $($d.title) — video heights: $($heights -join ', ') — formats: $($d.formats.Count)"
          } catch { Write-Host "YouTube answer: $json" }
          # Other sites (the build keeps the answers with the snapshots so they can be reviewed).
          New-Item -ItemType Directory -Force build/snapshots | Out-Null
          $report = @()
          foreach ($u in "https://www.dailymotion.com/video/xbu9cma", "https://geo.dailymotion.com/player/xtv3w.html?video=xbu9cma") {
            $out = & "$tools/yt-dlp.exe" -J --no-playlist --no-warnings --ignore-no-formats-error $u 2>&1
            try {
              $d = ($out | Where-Object { $_ -like '{*' }) | ConvertFrom-Json
              $h = $d.formats | Where-Object { $_.height } | ForEach-Object { $_.height } | Sort-Object -Unique
              $report += "$u => $($d.title) | heights: $($h -join ', ') | formats: $($d.formats.Count)"
              $report += $d.formats | ForEach-Object { "   $($_.format_id) | ext=$($_.ext) | v=$($_.vcodec) | a=$($_.acodec) | h=$($_.height) | proto=$($_.protocol) | aext=$($_.audio_ext) | vext=$($_.video_ext) | res=$($_.resolution)" }
            } catch { $report += "$u => $(($out | Select-Object -Last 3) -join ' ')" }
          }
          $report | Set-Content build/snapshots/sites-check.txt -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }

      - name: Check the app starts and talks to the extension
        run: |
          $p = Start-Process build/publish/IBRADownloadManager.exe -ArgumentList "--background" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $r = Invoke-RestMethod http://127.0.0.1:39401/ping -TimeoutSec 2; $ok = $r.app -eq "IBDM Pro"; $r | ConvertTo-Json -Compress } catch { }
          }
          $alive = -not $p.HasExited
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:APPDATA/IBRA Download Manager/log.txt" -ErrorAction SilentlyContinue; throw "the app did not answer on 127.0.0.1:39401 (alive: $alive)" }
          Write-Host "App started and answered the extension ping."

      - name: Rename from IBDM Pro (an older install's folders move to the new names)
        run: |
          $dl = (New-Object -ComObject Shell.Application).NameSpace('shell:Downloads').Self.Path
          $oldCfg = "$env:APPDATA\IBDM Pro"; $newCfg = "$env:APPDATA\IBRA Download Manager"
          $oldRoot = Join-Path $dl "IBDM Pro"; $newRoot = Join-Path $dl "IBRA Download Manager"
          Remove-Item -Recurse -Force $newCfg, $newRoot, $oldCfg, $oldRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $oldCfg, "$oldRoot\فيديو", "$oldRoot\مضغوطات" | Out-Null
          Set-Content "$oldRoot\فيديو\clip.mp4" "finished video" -Encoding utf8
          Set-Content "$oldRoot\مضغوطات\half.zip.ibdmpart" "unfinished" -Encoding utf8
          $settings = [ordered]@{ DownloadRoot = $oldRoot; Language = "ar"; HasSeenWelcome = $true; StartWithWindows = $false; GlassDefaultApplied = $true; Theme = "glass-dark";
            Categories = @(@{ Name = "فيديو"; Folder = "فيديو"; Extensions = @("mp4") }, @{ Name = "مضغوطات"; Folder = "مضغوطات"; Extensions = @("zip") }) }
          [IO.File]::WriteAllText("$oldCfg\settings.json", ($settings | ConvertTo-Json -Depth 5), (New-Object Text.UTF8Encoding $false))
          $list = @(@{ FileName = "clip.mp4"; Folder = "$oldRoot\فيديو"; TotalBytes = 15; Downloaded = 15 }, @{ FileName = "half.zip"; Folder = "$oldRoot\مضغوطات"; TotalBytes = 100; Downloaded = 10 })
          [IO.File]::WriteAllText("$oldCfg\downloads.json", (ConvertTo-Json -InputObject $list -Depth 5), (New-Object Text.UTF8Encoding $false))
          $p = Start-Process build/publish/IBRADownloadManager.exe -ArgumentList "--background" -PassThru
          Start-Sleep 10
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          $s = Get-Content "$newCfg\settings.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $d = Get-Content "$newCfg\downloads.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $checks = [ordered]@{
            "settings moved to the new folder" = (Test-Path "$newCfg\settings.json") -and -not (Test-Path $oldCfg)
            "downloads folder renamed" = (Test-Path $newRoot) -and -not (Test-Path $oldRoot) -and ($s.DownloadRoot -eq $newRoot)
            "finished file in Video" = Test-Path "$newRoot\Video\clip.mp4"
            "unfinished part in Compressed" = Test-Path "$newRoot\Compressed\half.zip.ibdmpart"
            "type folders English in settings" = (($s.Categories | Where-Object { $_.Name -eq "فيديو" }).Folder -eq "Video")
            "download list follows the files" = ((($d | Where-Object { $_.FileName -eq "clip.mp4" }).Folder) -eq "$newRoot\Video") -and ((($d | Where-Object { $_.FileName -eq "half.zip" }).Folder) -eq "$newRoot\Compressed")
            "rename done once" = $s.FoldersRenamed -eq $true
          }
          New-Item -ItemType Directory -Force build/snapshots | Out-Null
          $report = $checks.GetEnumerator() | ForEach-Object { "$(if ($_.Value) { 'PASS' } else { 'FAIL' })  $($_.Key)" }
          $report += Get-Content "$newCfg\log.txt" -ErrorAction SilentlyContinue | Select-Object -Last 8
          $report | Set-Content build/snapshots/rename-check.txt -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }
          Remove-Item -Recurse -Force $newCfg, $newRoot -ErrorAction SilentlyContinue
          if ($checks.Values -contains $false) { throw "rename from IBDM Pro failed" }

      - name: Check the "search for update" reads GitHub
        run: |
          Start-Process build/publish/IBRADownloadManager.exe -ArgumentList "--check-update", "update.txt" -Wait
          $t = Get-Content update.txt
          Write-Host $t
          if ($t -notmatch "^current=") { throw "update check failed: $t" }

      - name: Automatic extension install (real Chrome, Edge and Brave)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          New-Item -ItemType Directory -Force build/snapshots/extension-install | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($file) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($file); $g.Dispose(); $bmp.Dispose()
          }
          # A fresh CI machine: skip the browsers' one-time welcome/sign-in screens (a normal PC is already past them).
          foreach ($k in "HKLM:\SOFTWARE\Policies\Google\Chrome", "HKLM:\SOFTWARE\Policies\Microsoft\Edge") { New-Item -Path $k -Force | Out-Null }
          Set-ItemProperty "HKLM:\SOFTWARE\Policies\Google\Chrome" BrowserSignin 0 -Type DWord
          Set-ItemProperty "HKLM:\SOFTWARE\Policies\Microsoft\Edge" HideFirstRunExperience 1 -Type DWord
          Set-ItemProperty "HKLM:\SOFTWARE\Policies\Microsoft\Edge" BrowserSignin 0 -Type DWord
          choco install brave -y --no-progress | Out-Null
          $ext = (Resolve-Path build/publish/extension).Path
          $app = Start-Process build/publish/IBRADownloadManager.exe -ArgumentList "--background" -PassThru
          Start-Sleep 6
          foreach ($b in "chrome", "msedge", "brave") {
            $job = Start-Job { param($exe, $b, $ext, $out) Start-Process $exe -ArgumentList "--install-extension", $b, $out, $ext -Wait } -ArgumentList (Resolve-Path build/publish/IBRADownloadManager.exe).Path, $b, $ext, "$PWD/install-$b.txt"
            Start-Sleep 12; Shot "build/snapshots/extension-install/$b-during.png"
            Wait-Job $job -Timeout 120 | Out-Null
            Shot "build/snapshots/extension-install/$b-after.png"
            Write-Host "===== $b ====="; Get-Content "install-$b.txt" -ErrorAction SilentlyContinue
            Get-Process $b -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
          }
          # Self-update: install an "old" copy (version 1.0.0), then replace its files like an app update does,
          # and check Chrome picks up the new version by itself.
          $old = "$env:TEMP\ibdm-ext-old"
          Remove-Item -Recurse -Force $old -ErrorAction SilentlyContinue
          Copy-Item $ext $old -Recurse
          $m = Get-Content "$old/manifest.json" -Raw -Encoding utf8
          [IO.File]::WriteAllText("$old/manifest.json", ($m -replace '"version":\s*"[^"]*"', '"version": "1.0.0"'), (New-Object Text.UTF8Encoding $false))
          # -Wait would also wait for Chrome (started by the installer) to close, so wait for the installer only.
          $p = Start-Process (Resolve-Path build/publish/IBRADownloadManager.exe).Path -ArgumentList "--install-extension", "chrome", "$PWD/install-old.txt", $old -PassThru
          $p.WaitForExit(150000) | Out-Null
          Get-Content install-old.txt
          Shot "build/snapshots/extension-install/selfupdate-1-old.png"
          Copy-Item "$ext/*" $old -Recurse -Force
          Start-Sleep 100
          Shot "build/snapshots/extension-install/selfupdate-2-after.png"
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force
          Invoke-RestMethod http://127.0.0.1:39401/status | ConvertTo-Json -Compress
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

      - name: The real window on screen (title-bar buttons on the right in both languages)
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force build/snapshots/screen | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($file) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($file); $g.Dispose(); $bmp.Dispose()
          }
          # Windows' "Transparency effects" on, so the glass styles really show what is behind the window.
          New-Item -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Force | Out-Null
          Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" EnableTransparency 1 -Type DWord
          Write-Host "Windows build: $([Environment]::OSVersion.Version)"
          $cfg = "$env:APPDATA\IBRA Download Manager"
          New-Item -ItemType Directory -Force $cfg | Out-Null
          foreach ($run in "ar:glass", "en:glass", "ar:glass-clear", "ar:glass-dark", "ar:dark", "ar:glass-white") {
            $lang, $theme = $run.Split(":")
            $s = if (Test-Path "$cfg\settings.json") { Get-Content "$cfg\settings.json" -Raw | ConvertFrom-Json } else { [pscustomobject]@{} }
            $s | Add-Member -NotePropertyName Language -NotePropertyValue $lang -Force
            $s | Add-Member -NotePropertyName Theme -NotePropertyValue $theme -Force
            $s | Add-Member -NotePropertyName HasSeenWelcome -NotePropertyValue $true -Force
            $s | ConvertTo-Json -Depth 10 | Set-Content "$cfg\settings.json" -Encoding utf8
            $p = Start-Process build/publish/IBRADownloadManager.exe -PassThru
            Start-Sleep 8
            Shot "build/snapshots/screen/window-$lang-$theme.png"
            # Open the first menu (Alt, then Down) to check its text can be read in this style.
            $ws = New-Object -ComObject WScript.Shell
            $ws.AppActivate($p.Id) | Out-Null; Start-Sleep 1
            [System.Windows.Forms.SendKeys]::SendWait("%"); Start-Sleep 1
            [System.Windows.Forms.SendKeys]::SendWait("{DOWN}"); Start-Sleep 2
            Shot "build/snapshots/screen/menu-$lang-$theme.png"
            [System.Windows.Forms.SendKeys]::SendWait("{ESC}{ESC}")
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }

      - name: Snapshots of every window
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force build/snapshots/dark, build/snapshots/light, build/snapshots/glass | Out-Null
          Start-Process build/publish/IBRADownloadManager.exe -ArgumentList "--snapshot", "build/snapshots/glass", "--theme", "glass" -Wait
          New-Item -ItemType Directory -Force build/snapshots/english | Out-Null
          Start-Process build/publish/IBRADownloadManager.exe -ArgumentList "--snapshot", "build/snapshots/english", "--theme", "glass", "--lang", "en" -Wait
          Start-Process build/publish/IBRADownloadManager.exe -ArgumentList "--snapshot", "build/snapshots/dark", "--theme", "dark" -Wait
          Start-Process build/publish/IBRADownloadManager.exe -ArgumentList "--snapshot", "build/snapshots/light", "--theme", "light" -Wait
          foreach ($t in "glass-white", "glass-dark", "glass-clear", "auto") {
            New-Item -ItemType Directory -Force "build/snapshots/$t" | Out-Null
            Start-Process build/publish/IBRADownloadManager.exe -ArgumentList "--snapshot", "build/snapshots/$t", "--theme", $t, "--lang", "ar" -Wait
          }
          Get-ChildItem build/snapshots -Recurse | Format-Table FullName, Length
          Get-ChildItem build/snapshots -Recurse -Filter *.txt | ForEach-Object { Get-Content $_ }

      - name: Keep the snapshots on the ci-snapshots branch (to review the look of each build)
        continue-on-error: true
        run: |
          $dir = "build/snapshots"
          Set-Location $dir
          git init -q -b ci-snapshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Snapshots of ${{ steps.v.outputs.version }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-snapshots

      - name: Make sure Inno Setup has Arabic
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (!(Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
          if (!(Test-Path "$inno\Languages\Arabic.isl")) {
            Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Arabic.isl" -OutFile "$inno\Languages\Arabic.isl"
          }

      - name: Build the installer
        working-directory: installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DAppVersion=${{ steps.v.outputs.version }} "/DSource=..\build\publish" IbdmPro.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem ..\build\installer | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-Download-Manager-Setup
          path: build/installer/*

      - name: Publish a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: IBRA Download Manager ${{ steps.v.outputs.version }}
          make_latest: true
          files: |
            build/installer/IBRA-Download-Manager-Setup.exe
            build/installer/IBRA-Download-Manager-Extension.zip
          body: |
            ## IBRA Download Manager ${{ steps.v.outputs.version }}
            مدير تحميل — برمجة و تطوير **ابراهيم الخزرجي**

            **التثبيت:** حمّل **IBRA-Download-Manager-Setup.exe** وشغّله. إذا طلع تحذير Windows: More info ← Run anyway.

            **إضافة المتصفح:** موجودة داخل البرنامج (زر «الإضافة» بالأعلى يشرح الخطوات)، أو حمّل **IBRA-Download-Manager-Extension.zip** وفكّه ثم من `chrome://extensions` فعّل Developer mode ← Load unpacked.
            بعد كل تحديث اضغط ⟳ على بطاقة الإضافة.

            **أندرويد:** حمّل **IBRA-Download-Manager-Android-arm64.apk** (أغلب الهواتف)، أو **‑armv7.apk** للهواتف القديمة، وثبّته.
            **آيفون:** **IBRA-Download-Manager-iPhone-unsigned.ipa** غير موقّع — وقّعه وثبّته بأداة مثل Sideloadly أو AltStore.

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build the APKs
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/mobile/android/signing/ibra-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ibra
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Without the key's password (a repository secret) the APKs are signed with a test key.
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then unset ANDROID_KEYSTORE_FILE; echo "::warning::ANDROID_KEYSTORE_PASSWORD is not set: test-signed APKs"; fi
          gradle assembleRelease --no-daemon -PappVersion=1.0.${{ github.run_number }} -PappCode=${{ github.run_number }}
          mkdir -p ../../build/mobile
          out=app/build/outputs/apk/release
          ls -la $out
          # Only APKs signed with the app's own key go into the release (phones accept updates only with the same key).
          pre=IBRA-Download-Manager-Android; [ -z "${ANDROID_KEYSTORE_FILE:-}" ] && pre=test-signed-IBRA-Download-Manager-Android
          cp $out/app-arm64-v8a-release.apk ../../build/mobile/$pre-arm64.apk
          cp $out/app-armeabi-v7a-release.apk ../../build/mobile/$pre-armv7.apk
          cp $out/app-x86_64-release.apk ../../build/mobile/test-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/mobile/*

  android-check:
    name: Android app on an emulator (real downloads)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p shots
            adb shell wm size 1080x2400 ; adb shell wm density 420
            adb install -r -g apk/test-x86_64.apk
            adb shell am start -n com.ibrata2.ibradm/.MainActivity ; sleep 25 ; adb exec-out screencap -p > shots/1-start.png
            adb shell am start -n com.ibrata2.ibradm/.MainActivity -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "https://www.youtube.com/watch?v=jNQXAC9IVRw" --es mode mp3 --ez start true ; sleep 3
            adb shell am start -n com.ibrata2.ibradm/.MainActivity -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "https://www.youtube.com/watch?v=jNQXAC9IVRw" --es mode 720 --ez start true ; sleep 3
            adb shell am start -n com.ibrata2.ibradm/.MainActivity -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "https://github.com/ibrata2/ibdm-pro/raw/main/assets/ibdm-512.png" --ez start true ; sleep 3
            adb shell am start -n com.ibrata2.ibradm/.MainActivity -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "https://www.dailymotion.com/video/xbu9cma" --es mode 480 --ez start true ; sleep 60
            adb exec-out screencap -p > shots/2-downloading.png ; sleep 120
            adb exec-out screencap -p > shots/3-after.png ; sleep 120
            adb shell am start -n com.ibrata2.ibradm/.MainActivity ; sleep 3
            adb exec-out screencap -p > shots/4-later.png
            adb shell content query --uri content://media/external/downloads --projection _display_name:_size:relative_path || true
            adb logcat -d | grep -iE "IBRA|youtubedl|AndroidRuntime" | tail -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: shots/*
      - name: Keep the screenshots on the mobile-snapshots branch
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b mobile-android
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "android screenshots ${{ github.run_number }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:mobile-android

  ios:
    name: iPhone app (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build
        working-directory: mobile/ios
        run: |
          brew install xcodegen >/dev/null
          sed -i '' "s/MARKETING_VERSION: \"1.0.0\"/MARKETING_VERSION: \"1.0.${{ github.run_number }}\"/; s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate
          xcodebuild -project IBRA.xcodeproj -scheme IBRA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcpretty || exit ${PIPESTATUS[0]}
          mkdir -p Payload ../../build/mobile
          cp -R build/Build/Products/Release-iphoneos/IBRA.app Payload/
          zip -qry ../../build/mobile/IBRA-Download-Manager-iPhone-unsigned.ipa Payload
          ls -la ../../build/mobile
      - name: Screenshot on the simulator
        continue-on-error: true
        timeout-minutes: 15
        working-directory: mobile/ios
        run: |
          xcodebuild -project IBRA.xcodeproj -scheme IBRA -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build | xcpretty
          dev=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "simulator: $dev"
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl install "$dev" simbuild/Build/Products/Debug-iphonesimulator/IBRA.app
          xcrun simctl launch "$dev" com.ibrata2.ibradm; sleep 10
          mkdir -p ../../build/ios-shots
          xcrun simctl io "$dev" screenshot ../../build/ios-shots/1-start.png
          xcrun simctl openurl "$dev" "ibradm://download?url=https://www.youtube.com/watch?v=jNQXAC9IVRw"; sleep 5
          xcrun simctl io "$dev" screenshot ../../build/ios-shots/2-link.png
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/mobile/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screens
          path: build/ios-shots/*
      - name: Keep the screenshots on the mobile-snapshots branch
        if: always()
        run: |
          cd build/ios-shots
          git init -q && git checkout -q -b mobile-ios
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "ios screenshots ${{ github.run_number }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:mobile-ios

  mobile-release:
    name: Put the phone apps in the release
    needs: [build, android, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: mobile
      - uses: actions/download-artifact@v4
        with:
          name: ios
          path: mobile
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: |
            mobile/IBRA-Download-Manager-Android-arm64.apk
            mobile/IBRA-Download-Manager-Android-armv7.apk
            mobile/IBRA-Download-Manager-iPhone-unsigned.ipa
